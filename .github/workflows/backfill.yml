name: Backfill (7 PM - 7 AM NPT on trading days, all day on non-trading days)
on:
  schedule:
    # UTC = NPT - 5:45.  Starts at 07:00, 13:00, 19:00, 01:00 NPT; the script decides if it may run.
    - cron: "15 1,7,13,19 * * *"
concurrency:
  group: floorsheet-scrape
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest        # use [self-hosted] for very large days (no 6 h job limit)
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - uses: actions/cache/restore@v4
        with:
          path: .partial
          key: partial-${{ github.run_id }}
          restore-keys: partial-
      - run: python -m src.runner backfill --max-minutes 325
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .partial
          key: partial-${{ github.run_id }}
      - name: Commit data
        if: always()
        run: |
          git config user.name "floorsheet-bot"; git config user.email "bot@users.noreply.github.com"
          git add data state
          git diff --cached --quiet || git commit -m "Backfill floorsheet data $(date -u +%F)"
          git pull --rebase -X ours || true
          git push
